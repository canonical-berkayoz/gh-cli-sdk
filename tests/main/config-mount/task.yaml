summary: The gh configuration directory is a workshop-owned mount

prepare: |
  envsubst '${BASE}' <workshop.yaml.in >workshop.yaml
  workshop launch

restore: |
  workshop remove || true

execute: |
  workshop exec -- bash -lc 'findmnt -n -o TARGET /home/workshop/.config/gh' | MATCH '^/home/workshop/\.config/gh$'
  workshop exec -- bash -lc 'stat -c %U /home/workshop/.config/gh' | MATCH '^workshop$'
  workshop exec -- bash -lc 'touch ~/.config/gh/probe && rm ~/.config/gh/probe'

debug: |
  workshop exec -- bash -lc 'findmnt /home/workshop/.config/gh' || true
