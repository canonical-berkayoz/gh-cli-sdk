# Single `latest` track. Multi-base SDK, so platforms are BASE:ARCH pairs
# matching sdkcraft.yaml and the platform flag is --platform.
# The staging secret is deliberate: a fresh SDK must not publish to the
# production Store. Flip to SDKCRAFT_STORE_CREDENTIALS_PROD when ready.
# `risk` is left at the sdkcraft-actions default (edge); setting
# `risk: "stable"` is the publish-store promotion step.

name: Build and Upload SDK

on:
  push:
    branches:
      - "latest"
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch name (latest)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-and-upload:
    uses: canonical/sdkcraft-actions/.github/workflows/upload.yml@main
    with:
      platforms: '["ubuntu@22.04:amd64","ubuntu@22.04:arm64","ubuntu@24.04:amd64","ubuntu@24.04:arm64","ubuntu@26.04:amd64","ubuntu@26.04:arm64"]'
      platform-flag: "--platform"
    secrets:
      SDKCRAFT_STORE_CREDENTIALS: ${{ secrets.SDKCRAFT_STORE_CREDENTIALS_STAGING }}
